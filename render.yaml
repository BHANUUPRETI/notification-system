services:
  # ---------------------------------------------------------------------------
  # Django API
  # ---------------------------------------------------------------------------
  - type: web
    name: notification-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend

    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py seed_triggers
      python manage.py create_demo_users --admin
      python manage.py collectstatic --noinput

    startCommand: gunicorn config.wsgi:application --log-file - --access-logfile - --workers 2 --threads 4 --timeout 120

    healthCheckPath: /api/health/

    envVars:
      # -----------------------------------------------------------------------
      # Python / Django
      # -----------------------------------------------------------------------
      - key: PYTHON_VERSION
        value: "3.12.10"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "notification-api-dft7.onrender.com,localhost,127.0.0.1"

      # After Vercel deployment, set these to your real Vercel HTTPS URL.
      # Example:
      # https://notification-system-xyz.vercel.app
      - key: CORS_ORIGINS
        sync: false

      - key: FRONTEND_URL
        sync: false

      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------
      - key: POSTGRES_DB
        fromDatabase:
          name: notification-db
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: notification-db
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: notification-db
          property: password

      - key: POSTGRES_HOST
        fromDatabase:
          name: notification-db
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: notification-db
          property: port

      # -----------------------------------------------------------------------
      # Notification mode
      # -----------------------------------------------------------------------
      - key: NOTIFICATION_SANDBOX
        value: "False"

      # -----------------------------------------------------------------------
      # WhatsApp Cloud API
      # -----------------------------------------------------------------------
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false

      - key: WHATSAPP_API_VERSION
        value: "v25.0"

      # -----------------------------------------------------------------------
      # Email - Brevo
      # -----------------------------------------------------------------------
      - key: EMAIL_PROVIDER
        value: brevo

      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_FROM_EMAIL
        sync: false

      # -----------------------------------------------------------------------
      # OneSignal Web Push
      # -----------------------------------------------------------------------
      - key: ONESIGNAL_APP_ID
        sync: false

      - key: ONESIGNAL_REST_API_KEY
        sync: false

      # -----------------------------------------------------------------------
      # Internal inactivity endpoint protection
      # -----------------------------------------------------------------------
      - key: SCAN_TOKEN
        generateValue: true


# -----------------------------------------------------------------------------
# PostgreSQL
# Render Postgres databases must be defined in the top-level databases block.
# -----------------------------------------------------------------------------
databases:
  - name: notification-db
    plan: free
    region: singapore
    databaseName: notifications
    user: notify